services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: tripweave
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tripweave}
      POSTGRES_DB: tripweave
    volumes:
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tripweave"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://tripweave:${POSTGRES_PASSWORD:-tripweave}@db:5432/tripweave
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "8080:80"

volumes:
  dbdata:
